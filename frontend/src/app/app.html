<mat-sidenav-container class="app-shell">
  <mat-sidenav
    #drawer
    class="sidebar"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidebarOpen() : true"
    (closed)="sidebarOpen.set(false)"
  >
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>receipt_long</mat-icon>
      </div>
      <div>
        <h1>KORP</h1>
        <span>Emissor Fiscal</span>
      </div>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarIfMobile()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/produtos" routerLinkActive="active" (click)="closeSidebarIfMobile()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Produtos</span>
      </a>
      <a mat-list-item routerLink="/notas-fiscais" routerLinkActive="active" (click)="closeSidebarIfMobile()">
        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Notas Fiscais</span>
      </a>
    </mat-nav-list>

    <div class="sidebar-footer">
      <div class="status-dot"></div>
      <div>
        <strong>Sistema Online</strong>
        <p>Ambiente de desenvolvimento</p>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isMobile()) {
        <button mat-icon-button (click)="toggleSidebar()" aria-label="Abrir menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h2>{{ pageTitle() }}</h2>
      <span class="spacer"></span>
      <a mat-flat-button color="primary" routerLink="/notas-fiscais/nova">
        <mat-icon>add</mat-icon>
        Nova Nota Fiscal
      </a>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
