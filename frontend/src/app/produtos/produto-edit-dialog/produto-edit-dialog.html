<h2 mat-dialog-title>Editar produto {{ produto.codigo }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="edit-form">
    <mat-form-field appearance="outline">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="descricao" maxlength="200" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Saldo</mat-label>
      <input matInput type="number" formControlName="saldo" min="0" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="salvar()">Salvar</button>
</mat-dialog-actions>
