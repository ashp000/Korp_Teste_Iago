version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: korp_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  estoque-service:
    build: ./backend/EstoqueService
    container_name: korp_estoque_service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=korp_estoque;Username=postgres;Password=postgres"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  faturamento-service:
    build: ./backend/FaturamentoService
    container_name: korp_faturamento_service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=korp_faturamento;Username=postgres;Password=postgres"
      Servicos__EstoqueBaseUrl: "http://estoque-service:8080"
    depends_on:
      postgres:
        condition: service_healthy
      estoque-service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: korp_frontend
    ports:
      - "4200:80"
    depends_on:
      - estoque-service
      - faturamento-service

volumes:
  postgres_data:
